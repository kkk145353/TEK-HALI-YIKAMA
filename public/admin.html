<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Yönetim Paneli · Tek Halı Yıkama</title>
  <meta name="theme-color" content="#6a0916">
  <link rel="icon" href="assets/favicon-48.png" type="image/png">
  <meta name="apple-mobile-web-app-title" content="Tek Panel">
  <link rel="manifest" href="/admin.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/config.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-hali" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5" fill="none" stroke="#f5f1ea" stroke-width="1.6"/><rect x="7.5" y="6.5" width="9" height="11" rx=".5" fill="none" stroke="#d9922e" stroke-width="1.6"/><path d="M12 9.5l2 2.5-2 2.5-2-2.5z" fill="#d9922e"/><path d="M6 1.5v1.5M9 1.5v1.5M12 1.5v1.5M15 1.5v1.5M18 1.5v1.5M6 21v1.5M9 21v1.5M12 21v1.5M15 21v1.5M18 21v1.5" stroke="#f5f1ea" stroke-width="1.3" stroke-linecap="round"/></symbol>
    <symbol id="i-yenile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
    <symbol id="i-zil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></symbol>
    <symbol id="i-wp" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4a.5.5 0 0 0 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/></symbol>
    <symbol id="i-cikis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
  </svg>

  <div id="giris" class="giris-ekran">
    <form id="form-giris" class="giris-kutu" novalidate>
      <div class="marka">
        <span class="marka-ikon" aria-hidden="true"><img src="assets/logo-tac.png" alt="" width="38" height="38"></span>
        <span><b data-dukkan="ad">Halı Yıkama</b><small>Yönetim Paneli</small></span>
      </div>
      <label class="alan"><span>Şifre</span><input type="password" name="sifre" autocomplete="current-password" required autofocus></label>
      <p class="form-hata" role="alert" hidden></p>
      <button class="btn btn-ana" type="submit">Giriş Yap</button>
    </form>
  </div>

  <div id="panel" hidden>
    <header class="ust">
      <div class="kap ust-ic">
        <a class="marka" href="admin">
          <span class="marka-ikon" aria-hidden="true"><img src="assets/logo-tac.png" alt="" width="38" height="38"></span>
          <span><b data-dukkan="ad">Halı Yıkama</b><small id="guncelleme">Yönetim Paneli</small></span>
        </a>
        <div class="buton-sira ust-butonlar" style="flex-wrap:nowrap">
          <button class="btn btn-hafif btn-kucuk zil" id="zil" type="button" aria-label="Bildirimler" aria-expanded="false" aria-controls="zil-panel"><svg class="ik"><use href="#i-zil"/></svg><span class="zil-sayi" id="zil-sayi" hidden>0</span></button>
          <button class="btn btn-hafif btn-kucuk" id="yenile" type="button" aria-label="Yenile"><svg class="ik"><use href="#i-yenile"/></svg><span class="metin">Yenile</span></button>
          <button class="btn btn-hafif btn-kucuk" id="cikis" type="button" aria-label="Çıkış"><svg class="ik"><use href="#i-cikis"/></svg><span class="metin">Çıkış</span></button>
        </div>
      </div>
    </header>

    <div class="zil-panel" id="zil-panel" hidden>
      <div class="zil-baslik"><h3>Bildirimler</h3><button type="button" class="kapat-x" id="zil-kapat" aria-label="Kapat">×</button></div>
      <div id="zil-izin" class="zil-izin"></div>
      <div id="zil-liste" class="zil-liste"></div>
      <button type="button" class="btn btn-hafif btn-kucuk" id="zil-okundu" style="width:100%">Tümünü okundu say</button>
    </div>

    <main class="kap" style="padding-bottom:60px">
      <div class="serit" id="serit" role="status" hidden></div>

      <div class="ozet">
        <div class="ozet-kart"><small>Alınacak / gelecek</small><b id="o-yeni">0</b></div>
        <div class="ozet-kart"><small>İşlemde</small><b id="o-islem">0</b></div>
        <div class="ozet-kart"><small>Teslime hazır</small><b id="o-hazir">0</b></div>
        <div class="ozet-kart"><small>Bugün teslim edilen</small><b id="o-bugun">0</b></div>
      </div>

      <div class="kod-kutu">
        <label for="kod-ara">Teslimat kodu ile bul</label>
        <form class="kod-form" id="form-kod" novalidate>
          <input id="kod-ara" name="kod" maxlength="6" placeholder="Müşterinin söylediği 6 haneli kod" autocapitalize="characters" autocomplete="off" spellcheck="false">
          <button class="btn" type="submit">Bul</button>
        </form>
        <div class="kod-sonuc" id="kod-sonuc"></div>
      </div>

      <div class="arac">
        <div class="sekmeler" role="tablist">
          <button class="aktif" data-sekme="aktif" role="tab">Aktif Siparişler <span class="sayi" id="s-aktif">0</span></button>
          <button data-sekme="gecmis" role="tab">Geçmiş Siparişler <span class="sayi" id="s-gecmis" style="background:#8a96a0">0</span></button>
        </div>
        <input class="ara" id="ara" type="search" placeholder="İsim, telefon, adres veya kod ara…" aria-label="Ara">
        <select id="filtre" aria-label="Filtre">
          <option value="">Tümü</option>
          <option value="adres">Adresten alınacak</option>
          <option value="dukkan">Dükkana getirecek</option>
        </select>
      </div>

      <div id="liste" class="liste"></div>
    </main>
  </div>

  <div class="sonuc-arka" id="mb" hidden>
    <div class="sonuc-kutu mb-kutu" role="dialog" aria-modal="true" aria-labelledby="mb-baslik">
      <h2 id="mb-baslik">Müşteriye bildirilsin mi?</h2>
      <p id="mb-alt"></p>
      <label class="alan" style="text-align:left;margin-top:16px"><span>Gönderilecek mesaj</span><textarea id="mb-metin" rows="7"></textarea></label>
      <div class="sonuc-butonlar">
        <a class="btn btn-wp" id="mb-gonder" target="_blank" rel="noopener"><svg class="ik"><use href="#i-wp"/></svg>WhatsApp'tan Gönder</a>
        <button class="btn btn-hafif" type="button" id="mb-iptal">Gönderme</button>
      </div>
    </div>
  </div>

  <script src="assets/admin.js"></script>
</body>
</html>
